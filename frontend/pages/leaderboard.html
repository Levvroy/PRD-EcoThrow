<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - EcoThrow</title>
  <meta name="description" content="Ranking mahasiswa EcoThrow ITB - individu dan per-fakultas.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <script src="../js/api.js"></script>
  <script src="../js/navbar.js"></script>

  <main style="padding:2.5rem 0 4rem">
    <div class="container" style="max-width:960px">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 style="font-family:'Libre Baskerville',serif;font-style:italic;font-size:1.75rem;font-weight:700">
            Leaderboard</h1>
          <p class="text-muted" style="font-size:.875rem">Ranking mahasiswa EcoThrow · ITB</p>
        </div>
        <button class="btn-ghost btn-ghost-sm" onclick="loadBoard()" id="btn-refresh"></button>
      </div>

      <!-- Tabs -->
      <div class="et-tab-wrap mb-4">
        <button class="et-tab active" id="tab-individu" onclick="switchTab('individu')">
          <span id="icon-user-tab"></span> Individu
        </button>
        <button class="et-tab" id="tab-fakultas" onclick="switchTab('fakultas')">
          <span id="icon-users-tab"></span> Fakultas
        </button>
      </div>

      <!-- Podium -->
      <div id="podium-wrap"></div>

      <!-- Board -->
      <div class="et-card" id="board-card">
        <div id="board-wrap">
          <div class="loading-box">
            <div class="et-loader"></div><span>Memuat leaderboard...</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <script>
    let currentTab = "individu";

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("btn-refresh").innerHTML = lucideInline("refresh", 14) + " Refresh";
      document.getElementById("icon-user-tab").innerHTML = lucideInline("user", 15);
      document.getElementById("icon-users-tab").innerHTML = lucideInline("users", 15);
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tab-individu").classList.toggle("active", tab === "individu");
      document.getElementById("tab-fakultas").classList.toggle("active", tab === "fakultas");
      document.getElementById("podium-wrap").innerHTML = "";
      loadBoard();
    }

    async function loadBoard() {
      const wrap = document.getElementById("board-wrap");
      showLoading(wrap);
      try {
        if (currentTab === "individu") {
          const data = await apiGet("/api/leaderboard?limit=50");
          renderPodium(data.slice(0, 3));
          renderIndividu(data);
        } else {
          const data = await apiGet("/api/leaderboard/faculty");
          renderFakultas(data);
        }
      } catch {
        showError(wrap, "Tidak dapat memuat leaderboard. Cek koneksi ke server.");
      }
    }

    function renderPodium(top3) {
      if (top3.length < 3) return;
      const order = [top3[1], top3[0], top3[2]];
      const cls = ["p2", "p1", "p3"];
      const medal = ["🥈", "🥇", "🥉"];
      document.getElementById("podium-wrap").innerHTML = `
        <div class="podium-wrap mb-4">
          ${order.map((u, i) => `
          <div class="podium-item ${cls[i]}">
            <div class="podium-avatar">${medal[i]}</div>
            <div class="podium-name">${u.name.split(" ")[0]}</div>
            <div class="podium-xp">${fmtNum(u.total_xp)} XP</div>
            <div>${levelBadge(u.total_xp)}</div>
            <div class="podium-base"></div>
          </div>`).join("")}
        </div>`;
    }

    function renderIndividu(data) {
      const wrap = document.getElementById("board-wrap");
      if (!data.length) { wrap.innerHTML = `<p class="text-muted text-center py-3">Belum ada peserta.</p>`; return; }
      wrap.innerHTML = `
        <div class="table-responsive">
          <table class="et-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Nama</th>
                <th>Fakultas</th>
                <th>Tier</th>
                <th>XP</th>
                <th>Streak</th>
              </tr>
            </thead>
            <tbody>
              ${data.map(u => `
              <tr>
                <td>${rankNum(u.rank)}</td>
                <td><strong>${u.name}</strong><br><span class="text-muted-sm">${u.nim}</span></td>
                <td class="text-muted-sm">${u.faculty}</td>
                <td>${levelBadge(u.total_xp)}</td>
                <td><strong class="text-emerald">${u.total_xp.toLocaleString()}</strong></td>
                <td><span class="streak-pill">${u.streak_days}d</span></td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    function renderFakultas(data) {
      const wrap = document.getElementById("board-wrap");
      if (!data.length) { wrap.innerHTML = `<p class="text-muted text-center py-3">Belum ada data.</p>`; return; }
      const max = data[0]?.total_xp || 1;
      wrap.innerHTML = `
        <div class="py-1">
          ${data.map(f => `
          <div class="d-flex align-items-center gap-3 py-3" style="border-bottom:1px solid var(--slate-100)">
            ${rankNum(f.rank)}
            <div style="flex:1;min-width:0">
              <div class="fw-600 mb-1">${f.faculty}</div>
              <div class="rpg-bar-wrap">
                <div class="rpg-bar-fill" style="width:${Math.round(f.total_xp / max * 100)}%"></div>
              </div>
            </div>
            <div class="text-end" style="white-space:nowrap">
              <strong class="text-emerald">${f.total_xp.toLocaleString()} XP</strong>
            </div>
          </div>`).join("")}
        </div>`;
    }

    loadBoard();
    setInterval(loadBoard, 30000);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
