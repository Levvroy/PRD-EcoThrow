<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — EcoThrow</title>
  <meta name="description" content="Visualisasi data dan statistik sistem EcoThrow ITB secara realtime.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <script src="../js/api.js"></script>
  <script src="../js/navbar.js"></script>

  <main style="padding:2.5rem 0 4rem">
    <div class="container" style="max-width:1140px">

      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 style="font-family:'Libre Baskerville',serif;font-style:italic;font-size:1.75rem;font-weight:700">Dashboard</h1>
          <p class="text-muted" style="font-size:.875rem">Visualisasi data realtime · EcoThrow ITB</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn-ghost btn-ghost-sm" onclick="exportCSV()" id="btn-csv"></button>
          <button class="btn-ghost btn-ghost-sm" onclick="loadAll()" id="btn-refresh"></button>
        </div>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
          <div class="et-stat">
            <div class="et-stat-num" id="d-users">—</div>
            <div class="et-stat-label" id="lbl-d-users">Pengguna</div>
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="et-stat">
            <div class="et-stat-num" id="d-throws">—</div>
            <div class="et-stat-label" id="lbl-d-throws">Total Pembuangan</div>
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="et-stat">
            <div class="et-stat-num" id="d-bins">—</div>
            <div class="et-stat-label" id="lbl-d-bins">Jumlah Bin</div>
          </div>
        </div>
      </div>

      <!-- Charts row -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="et-card h-100">
            <div class="et-card-title" id="lbl-chart">Pembuangan 7 Hari Terakhir</div>
            <div class="bar-chart" id="daily-chart">
              <div class="loading-box w-100"><div class="et-loader"></div></div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="et-card h-100">
            <div class="et-card-title" id="lbl-tier">Distribusi Tier Pengguna</div>
            <div id="tier-dist">
              <div class="loading-box"><div class="et-loader"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bin status table -->
      <div class="et-card mb-4">
        <div class="et-card-title" id="lbl-bins-table">Status Bin Realtime</div>
        <div class="table-responsive">
          <table class="et-table">
            <thead>
              <tr>
                <th>#</th><th>Lokasi</th><th>Kapasitas</th>
                <th>Status</th><th style="width:160px">Level</th><th>Update</th>
              </tr>
            </thead>
            <tbody id="bin-tbody">
              <tr><td colspan="6" class="text-center py-3"><div class="et-loader" style="margin:auto"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Users table -->
      <div class="et-card mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="et-card-title mb-0" id="lbl-users-table">Data Pengguna</div>
          <input id="search-user" class="et-input" placeholder="Cari nama / NIM…"
            style="width:200px;font-size:.85rem" oninput="filterUsers()">
        </div>
        <div class="table-responsive">
          <table class="et-table">
            <thead>
              <tr><th>#</th><th>Nama</th><th>NIM</th><th>Fakultas</th><th>Tier</th><th>Total XP</th></tr>
            </thead>
            <tbody id="user-tbody">
              <tr><td colspan="6" class="text-center py-3"><div class="et-loader" style="margin:auto"></div></td></tr>
            </tbody>
          </table>
        </div>
        <p id="user-count" class="text-muted-sm mt-2"></p>
      </div>

      <!-- Faculty summary -->
      <div class="et-card">
        <div class="et-card-title" id="lbl-faculty">Ringkasan Per Fakultas</div>
        <div id="faculty-wrap">
          <div class="loading-box"><div class="et-loader"></div></div>
        </div>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <script>
    let allUsers = [];

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("btn-csv").innerHTML        = lucideInline("download",14) + " Export CSV";
      document.getElementById("btn-refresh").innerHTML    = lucideInline("refresh",14)  + " Refresh";
      document.getElementById("lbl-d-users").innerHTML    = lucideInline("users",13)    + " Pengguna";
      document.getElementById("lbl-d-throws").innerHTML   = lucideInline("trash2",13)   + " Total Pembuangan";
      document.getElementById("lbl-d-bins").innerHTML     = lucideInline("wifi",13)     + " Jumlah Bin";
      document.getElementById("lbl-chart").innerHTML      = lucideInline("bar-chart",15)+ " Pembuangan 7 Hari Terakhir";
      document.getElementById("lbl-tier").innerHTML       = lucideInline("crown",15)    + " Distribusi Tier Pengguna";
      document.getElementById("lbl-bins-table").innerHTML = lucideInline("wifi",15)     + " Status Bin Realtime";
      document.getElementById("lbl-users-table").innerHTML= lucideInline("users",15)    + " Data Pengguna";
      document.getElementById("lbl-faculty").innerHTML    = lucideInline("users",15)    + " Ringkasan Per Fakultas";
      loadAll();
      setInterval(loadAll, 30000);
    });

    async function loadStats() {
      try {
        const d = await apiGet("/api/stats");
        document.getElementById("d-users").textContent  = fmtNum(d.total_users);
        document.getElementById("d-throws").textContent = fmtNum(d.total_throws);
        document.getElementById("d-bins").textContent   = fmtNum(d.total_bins);
        renderDailyChart(d.daily_throws);
      } catch { showToast("Gagal memuat statistik","error"); }
    }

    function renderDailyChart(data) {
      const wrap = document.getElementById("daily-chart");
      if (!data?.length) { wrap.innerHTML = `<p class="text-muted w-100 text-center">Belum ada data</p>`; return; }
      const max = Math.max(...data.map(d => d.count), 1);
      wrap.innerHTML = data.map(d => {
        const pct = Math.round(d.count / max * 100);
        return `
        <div class="bar-item">
          <div class="bar-val">${d.count}</div>
          <div class="bar-fill" style="height:${Math.max(pct,3)}%"></div>
          <div class="bar-label">${d.date.slice(5)}</div>
        </div>`;
      }).join("");
    }

    async function loadLevelDist() {
      try {
        const users = await apiGet("/api/users");
        allUsers = users;
        renderUserTable(users);
        renderTierDist(users);
        document.getElementById("user-count").textContent = `Total: ${users.length} pengguna`;
      } catch {
        document.getElementById("tier-dist").innerHTML = `<p class="text-muted">Gagal memuat data.</p>`;
      }
    }

    function renderTierDist(users) {
      const counts = {};
      TIERS.forEach(t => counts[t.name] = 0);
      users.forEach(u => { const t = getTier(u.total_xp); counts[t.name]++; });
      const total = users.length || 1;
      document.getElementById("tier-dist").innerHTML = TIERS.map(tier => {
        const count = counts[tier.name];
        const pct   = Math.round(count / total * 100);
        return `
        <div class="d-flex align-items-center gap-2 mb-2">
          <div style="width:90px;flex-shrink:0">${levelBadge(tier.minXp)}</div>
          <div style="flex:1">
            <div class="rpg-bar-wrap">
              <div class="rpg-bar-fill" style="width:${pct}%"></div>
            </div>
          </div>
          <span class="text-muted-sm" style="width:55px;text-align:right">${count} (${pct}%)</span>
        </div>`;
      }).join("");
    }

    function renderUserTable(users) {
      const tbody = document.getElementById("user-tbody");
      if (!users.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">Belum ada pengguna.</td></tr>`;
        return;
      }
      tbody.innerHTML = users.sort((a,b) => b.total_xp - a.total_xp).map((u, i) => `
        <tr>
          <td class="text-muted-sm">${i+1}</td>
          <td><strong>${u.name}</strong></td>
          <td class="text-muted-sm">${u.nim}</td>
          <td class="text-muted-sm">${u.faculty}</td>
          <td>${levelBadge(u.total_xp)}</td>
          <td><strong class="text-emerald">${u.total_xp.toLocaleString()}</strong></td>
        </tr>`).join("");
    }

    function filterUsers() {
      const q = document.getElementById("search-user").value.toLowerCase();
      const filtered = allUsers.filter(u => u.name.toLowerCase().includes(q) || u.nim.includes(q));
      renderUserTable(filtered);
      document.getElementById("user-count").textContent = `Menampilkan ${filtered.length} dari ${allUsers.length} pengguna`;
    }

    async function loadBins() {
      const tbody = document.getElementById("bin-tbody");
      try {
        const bins = await apiGet("/api/bins");
        if (!bins.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">Belum ada bin.</td></tr>`;
          return;
        }
        tbody.innerHTML = bins.map((b,i) => {
          const pct = Math.round(b.capacity_pct);
          const barColor = pct >= 80 ? "#f87171" : pct >= 50 ? "#fb923c" : "var(--emerald)";
          return `
          <tr>
            <td class="text-muted-sm">${i+1}</td>
            <td><strong>${b.location}</strong></td>
            <td><strong>${pct}%</strong></td>
            <td>${statusBadge(b.status)}</td>
            <td><div class="rpg-bar-wrap"><div class="rpg-bar-fill" style="width:${pct}%;background:${barColor}"></div></div></td>
            <td class="text-muted-sm">${relTime(b.last_updated)}</td>
          </tr>`;
        }).join("");
      } catch {
        tbody.innerHTML = `<tr><td colspan="6"><div class="et-alert et-alert-warn">Tidak dapat memuat data bin.</div></td></tr>`;
      }
    }

    async function loadFaculty() {
      const wrap = document.getElementById("faculty-wrap");
      try {
        const data = await apiGet("/api/leaderboard/faculty");
        if (!data.length) { wrap.innerHTML = `<p class="text-muted">Belum ada data.</p>`; return; }
        const max = data[0]?.total_xp || 1;
        wrap.innerHTML = `
          <div class="table-responsive">
            <table class="et-table">
              <thead><tr><th>#</th><th>Fakultas</th><th>Total XP</th><th style="width:180px">Kontribusi</th></tr></thead>
              <tbody>
                ${data.map(f => `
                <tr>
                  <td>${rankNum(f.rank)}</td>
                  <td><strong>${f.faculty}</strong></td>
                  <td><strong class="text-emerald">${f.total_xp.toLocaleString()}</strong></td>
                  <td><div class="rpg-bar-wrap"><div class="rpg-bar-fill" style="width:${Math.round(f.total_xp/max*100)}%"></div></div></td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      } catch { wrap.innerHTML = `<p class="text-muted">Gagal memuat data.</p>`; }
    }

    function exportCSV() {
      if (!allUsers.length) { showToast("Tidak ada data untuk diekspor","error"); return; }
      const header = ["NIM","Nama","Fakultas","Tier","Total XP"].join(",");
      const rows = allUsers.map(u => {
        const tier = getTier(u.total_xp);
        return [u.nim, `"${u.name}"`, u.faculty, tier.name, u.total_xp].join(",");
      });
      const blob = new Blob([[header,...rows].join("\n")], { type:"text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `ecothrow_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      showToast("Data berhasil diekspor!","success");
    }

    async function loadAll() {
      await Promise.all([loadStats(), loadLevelDist(), loadBins(), loadFaculty()]);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
