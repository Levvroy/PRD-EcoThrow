<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login Admin - EcoThrow</title>
  <meta name="description" content="Login ke panel admin EcoThrow.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--emerald-pale) 0%, #fff 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .08);
      width: 100%;
      max-width: 420px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-brand .brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--emerald-pale);
      border: 1.5px solid var(--emerald-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--emerald);
      margin: 0 auto 12px;
    }

    .pass-wrap {
      position: relative;
    }

    .pass-wrap .et-input {
      width: 100%;
      padding-right: 44px;
    }

    .pass-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--slate-400);
      padding: 4px;
    }

    .login-err {
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: var(--radius);
      padding: 10px 14px;
      color: #dc2626;
      font-size: .85rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .attempts-warn {
      font-size: .78rem;
      color: #c2410c;
      margin-top: .5rem;
      display: none;
    }
  </style>
</head>

<body>
  <script src="../js/api.js"></script>

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon" id="brand-icon"></div>
      <div style="font-family:'Libre Baskerville',serif;font-style:italic;font-size:1.4rem;font-weight:700">
        Eco<span class="brand-accent">Throw</span>
      </div>
      <p class="text-muted-sm mt-1">Panel Admin · STEI ITB 2025</p>
    </div>

    <div class="login-err" id="login-err">
      <span id="err-icon"></span>
      <span id="err-msg">Password salah.</span>
    </div>

    <div class="mb-3">
      <label class="et-label">Password Admin</label>
      <div class="pass-wrap">
        <input type="password" id="admin-pass" class="et-input" placeholder="Masukkan password admin..."
          autocomplete="current-password">
        <button class="pass-toggle" id="toggle-pass" type="button" onclick="togglePass()">
          <span id="icon-eye"></span>
        </button>
      </div>
      <p class="attempts-warn" id="attempts-warn"></p>
    </div>

    <button class="btn-emerald w-100 justify-content-center" id="btn-login" onclick="doLogin()">
      <span id="icon-login"></span> Masuk sebagai Admin
    </button>

    <div class="text-center mt-3">
      <a href="../index.html" class="text-muted-sm" style="text-decoration:none;color:var(--slate-400)">
        ← Kembali ke Beranda
      </a>
    </div>
  </div>

  <script>
    // ── Config ────────────────────────────────────────────────────
    const ADMIN_PASSWORD = "etrosuksesjaya";
    const MAX_ATTEMPTS = 5;
    let attempts = 0;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("brand-icon").innerHTML = lucideInline("trash2", 24);
      document.getElementById("err-icon").innerHTML = lucideInline("alert-triangle", 15);
      document.getElementById("icon-eye").innerHTML = lucideInline("eye", 18);
      document.getElementById("icon-login").innerHTML = lucideInline("log-in", 16);

      // Already logged in? Redirect
      if (localStorage.getItem("et_admin") === "true") {
        window.location.href = "admin.html";
        return;
      }

      document.getElementById("admin-pass").addEventListener("keyup", e => {
        if (e.key === "Enter") doLogin();
      });

      // Check lockout
      checkLockout();
    });

    function togglePass() {
      const inp = document.getElementById("admin-pass");
      const eyeEl = document.getElementById("icon-eye");
      const visible = inp.type === "text";
      inp.type = visible ? "password" : "text";
      eyeEl.innerHTML = lucideInline(visible ? "eye" : "eye-off", 18);
    }

    function checkLockout() {
      const lockUntil = localStorage.getItem("et_lock_until");
      if (lockUntil && Date.now() < parseInt(lockUntil)) {
        const sec = Math.ceil((parseInt(lockUntil) - Date.now()) / 1000);
        showErr(`Terlalu banyak percobaan. Coba lagi dalam ${sec} detik.`);
        document.getElementById("btn-login").disabled = true;
        setTimeout(() => {
          document.getElementById("btn-login").disabled = false;
          hideErr();
        }, parseInt(lockUntil) - Date.now());
        return true;
      }
      return false;
    }

    function showErr(msg) {
      const el = document.getElementById("login-err");
      document.getElementById("err-msg").textContent = msg;
      el.style.display = "flex";
    }
    function hideErr() {
      document.getElementById("login-err").style.display = "none";
    }

    function doLogin() {
      if (checkLockout()) return;

      const pass = document.getElementById("admin-pass").value;
      const btn = document.getElementById("btn-login");

      if (!pass) { showErr("Masukkan password dulu."); return; }

      if (pass === ADMIN_PASSWORD) {
        // SUCCESS
        localStorage.setItem("et_admin", "true");
        btn.innerHTML = lucideInline("check-circle", 16) + " Berhasil! Mengalihkan...";
        btn.disabled = true;
        hideErr();
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 600);
      } else {
        // FAIL
        attempts++;
        document.getElementById("admin-pass").value = "";
        document.getElementById("admin-pass").classList.add("shake");
        setTimeout(() => document.getElementById("admin-pass").classList.remove("shake"), 400);

        const remaining = MAX_ATTEMPTS - attempts;
        if (remaining <= 0) {
          const lockUntil = Date.now() + 5 * 60 * 1000; // 5 menit
          localStorage.setItem("et_lock_until", lockUntil);
          showErr("Terlalu banyak percobaan. Dikunci 5 menit.");
          btn.disabled = true;
        } else {
          showErr(`Password salah. ${remaining} percobaan tersisa.`);
        }
      }
    }
  </script>

  <style>
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    .shake {
      animation: shake .35s ease;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
